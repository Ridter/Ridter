name: Update profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide=contribs&hide_border=true&hide_rank=true&border_radius=12&bg_color=45,E76544,8F4E92&title_color=ffffff&text_color=ffffff&icon_color=ffffff
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&border_radius=12&bg_color=45,E76544,8F4E92&title_color=ffffff&text_color=ffffff&icon_color=ffffff
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Match card sizes
        run: |
          python3 << 'PY'
          import re
          from pathlib import Path

          files = [Path("assets/stats.svg"), Path("assets/top-langs.svg")]
          parsed = []
          for path in files:
              text = path.read_text()
              match = re.search(
                  r'<svg\s+width="(\d+)"\s+height="(\d+)"\s+viewBox="0 0 (\d+) (\d+)"',
                  text,
              )
              parsed.append((path, text, int(match.group(1)), int(match.group(2))))

          width = max(item[2] for item in parsed)
          height = max(item[3] for item in parsed)
          for path, text, own_w, own_h in parsed:
              dx = (width - own_w) // 2
              dy = (height - own_h) // 2
              text = re.sub(
                  r'(<svg\s+)width="\d+"\s+height="\d+"\s+viewBox="0 0 \d+ \d+"',
                  rf'\1width="{width}" height="{height}" viewBox="0 0 {width} {height}"',
                  text,
                  count=1,
              )
              text = re.sub(
                  r'(data-testid="card-bg"[\s\S]*?height=")[^"]+("[\s\S]*?width=")[^"]+"',
                  rf'\g<1>{height - 1}\2{width - 1}"',
                  text,
                  count=1,
              )
              if dx or dy:
                  end = text.find("/>", text.find('data-testid="card-bg"')) + 2
                  text = text[:end] + f'\n<g transform="translate({dx}, {dy})">' + text[end:]
                  last = text.rfind("</svg>")
                  text = text[:last] + "</g>\n" + text[last:]
              path.write_text(text)
          PY

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg
          git diff --cached --quiet || git commit -m "Update profile assets [skip ci]"
          git push
